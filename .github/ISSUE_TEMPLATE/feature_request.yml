name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like CrossSync to do?
      description: Describe the problem or the situation, not just the solution.
      placeholder: I often want to send a whole folder from my PC to my phone, but…
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: How could it work?
      description: Optional. Your idea for how it could look or behave.
